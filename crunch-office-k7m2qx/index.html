  const c = { all: DATA.length, wait: 0, stale: 0, urgent: 0, stuck: 0, done: 0, none: 0 };
  for (const it of DATA) {
    for (const t of it.tags) if (c[t] !== undefined) c[t]++;
    if (!it.badge) c.none++;
  }
  return c;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[ch]));
}

function matches(it) {
  if (filter === "all") return true;
  return it.tags.includes(filter);
}

function cardHTML(it) {
  const st = state[it.id] || {};
  const choice = st.choice || "";
  const note = st.note || "";
  const meta = it.agent + " · " + it.status;
  const tip = [
    it.name,
    "לקוח: " + it.client,
    "סוכן: " + it.agent,
    it.goal ? "מטרה: " + it.goal : "",
    "סטטוס: " + it.status,
    "צעד הבא: " + it.next,
    "דדליין: " + it.deadline,
    "התחלה: " + it.start,
    "עדכון אחרון: " + it.updated
  ].filter(Boolean).join("\n");
  const badge = it.badge ? `<span class="badge ${it.bclass}">${esc(it.badge)}</span>` : "";
  const cont = it.continued ? `<span class="mark-go">להמשיך</span>` : "";
  return `<article class="card${it.bclass==="done"?" done":""}" data-id="${it.id}">
    <div class="top">
      <h3 title="${esc(tip)}">${esc(it.short)}</h3>
      ${cont}${badge}
    </div>
    <div class="meta" title="${esc(meta)}">${esc(meta)}</div>
    <div class="next" title="${esc(it.next)}">${esc(it.next)}</div>
    <div class="acts">
      <button type="button" class="btn go${choice==="go"?" on":""}" data-act="go">להמשיך</button>
      <button type="button" class="btn stop${choice==="stop"?" on":""}" data-act="stop">לסגור</button>
      <input class="note" type="text" maxlength="200" placeholder="מה השלב הבא? מה להשאיר?" value="${esc(note)}">
    </div>
  </article>`;
}

function sectionHTML(g, list) {
  return `<section data-group="${esc(g)}">
      <div class="ghead"><h2>${esc(g)}</h2><span class="n">${list.length}</span></div>
      <div class="grid">${list.map(cardHTML).join("")}</div>
    </section>`;
}
function miniHTML(g, list) {
  return `<div class="mini span${list.length}">
      <div class="ghead"><h2>${esc(g)}</h2><span class="n">${list.length}</span></div>
      <div class="grid cols-${list.length}">${list.map(cardHTML).join("")}</div>
    </div>`;
}
function renderBoards() {
  const root = document.getElementById("boards");
  const groups = GROUP_ORDER
    .map(g => ({ g, list: DATA.filter(it => it.group === g && matches(it)) }))
    .filter(x => x.list.length);
  const html = [];
  let i = 0;
  while (i < groups.length) {
    const cur = groups[i];
    if (cur.list.length <= 3) {
      const pack = [];
      let cols = 0;
      let j = i;
      while (j < groups.length && groups[j].list.length <= 3 && cols + groups[j].list.length <= 4) {
        pack.push(groups[j]);
        cols += groups[j].list.length;
        j++;
      }
      if (pack.length >= 2) {
        html.push(`<div class="pack">${pack.map(p => miniHTML(p.g, p.list)).join("")}</div>`);
        i = j;
        continue;
      }
    }
    html.push(sectionHTML(cur.g, cur.list));
    i++;
  }
  root.innerHTML = html.join("");
}

    <span class="mx">${esc(meta)}</span>
    <span class="when">${esc(when)}</span>
    <button type="button" class="reopen${on?" on":""}" data-act="reopen">לפתוח מחדש</button>
  </div>`;
}

function renderArchive() {
  const wrap = document.getElementById("archive-wrap");
  if (!ARCHIVE.length) { wrap.innerHTML = ""; return; }
  wrap.innerHTML = `<details class="archive"${archiveOpen?" open":""}>
    <summary>ארכיון (${ARCHIVE.length})</summary>
    <div class="arch-list">${ARCHIVE.map(archRowHTML).join("")}</div>
  </details>`;
}

function render() {
  renderHeader();
  renderBoards();
  renderArchive();
}

function setChoice(id, act) {
  const cur = state[id] || {};
  const next = { ...cur, choice: cur.choice === act ? "" : act };
  if (!next.choice && !next.note) delete state[id];
  else state[id] = next;
  save(state);
}

function setNote(id, note) {
  const cur = state[id] || {};
  const next = { ...cur, note: note };
  if (!next.choice && !next.note) delete state[id];
  else state[id] = next;
  save(state);
}

document.getElementById("archive-wrap").addEventListener("toggle", (e) => {
  if (e.target.classList.contains("archive")) archiveOpen = e.target.open;
}, true);

document.getElementById("archive-wrap").addEventListener("click", (e) => {
  const btn = e.target.closest(".reopen");
  if (!btn) return;
  const row = btn.closest(".arch-row");
  const cur = state[row.dataset.id] || {};
  const next = { ...cur, reopen: !cur.reopen };
  if (!next.reopen && !next.note && !next.choice) delete state[row.dataset.id];
  else state[row.dataset.id] = next;
  save(state);
  btn.classList.toggle("on", !!(state[row.dataset.id] || {}).reopen);
});

document.getElementById("boards").addEventListener("click", (e) => {
  const btn = e.target.closest(".btn");
  if (!btn) return;
  const card = btn.closest(".card");
  setChoice(card.dataset.id, btn.dataset.act);
  const go = card.querySelector(".btn.go");
  const stop = card.querySelector(".btn.stop");
  const choice = (state[card.dataset.id] || {}).choice || "";
  go.classList.toggle("on", choice === "go");
  stop.classList.toggle("on", choice === "stop");
});

document.getElementById("boards").addEventListener("input", (e) => {
  if (!e.target.classList.contains("note")) return;
  const card = e.target.closest(".card");
  setNote(card.dataset.id, e.target.value);
});

document.getElementById("filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter = chip.dataset.f;
  render();
});

function decisionsText() {
  const lines = [];
  for (const it of DATA) {
    const st = state[it.id] || {};
    if (!st.choice && !(st.note || "").trim()) continue;
    const verb = st.choice === "go" ? "להמשיך" : st.choice === "stop" ? "לסגור" : "";
    const note = (st.note || "").trim();
    let line = it.name + ":";
    if (verb) line += " " + verb + ".";
    if (note) line += (verb ? " " : " ") + note;
    lines.push(line);
  }
  for (const it of ARCHIVE) {
    const st = state[it.id] || {};
    if (!st.reopen && !(st.note || "").trim()) continue;
    let line = it.name + ":";
    if (st.reopen) line += " לפתוח מחדש.";
    const note = (st.note || "").trim();
    if (note) line += " " + note;
    lines.push(line);
  }
  return lines.join("\n");
}

document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = decisionsText();
  const msg = document.getElementById("msg");
  if (!text) { msg.textContent = "אין החלטות עדיין"; return; }
  try {
    await navigator.clipboard.writeText(text);
    msg.textContent = "הועתק";
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    msg.textContent = "הועתק";
  }
  setTimeout(() => { msg.textContent = ""; }, 2000);
});

document.getElementById("clearBtn").addEventListener("click", () => {
  for (const k of Object.keys(state)) delete state[k];
  save(state);
  render();
  document.getElementById("msg").textContent = "נוקה";
  setTimeout(() => { document.getElementById("msg").textContent = ""; }, 1600);
});

render();
</script>
</body>
</html>
