<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בית מדרש ויזניץ · אשדוד — סקירה</title>
<style>
@font-face{font-family:Heebo;font-weight:100 900;font-display:swap;src:url(fonts/Heebo-Hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:100 900;font-display:swap;src:url(fonts/Heebo-Latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
--bg1:#F8F4EC;--bg2:#fffdf8;--glow:rgba(245,138,7,.18);
--brand:#0B0B0B;--btn:#0B0B0B;--accent:#F58A07;--accent-ink:#0B0B0B;--accent-soft:#fde7c8;
--soft:#f1ebdf;--line:#e3dccd;--ring:rgba(245,138,7,.35);--shadow:rgba(11,11,11,.35);
--ink:#241a3a;--mut:#6b6580;--card:#fff;--red:#c4231a;--r:20px}
*{box-sizing:border-box}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.55 Heebo,system-ui,Arial,sans-serif;
  background:radial-gradient(900px 420px at 85% -80px,var(--glow),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2) 520px)}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}

/* ---- כותרת ---- */
.hero{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.logo{height:92px;width:auto;max-width:42%;object-fit:contain;flex:none}
.ttl{flex:1;min-width:0}
h1{font-size:clamp(24px,5vw,36px);line-height:1.12;margin:0;font-weight:800;color:var(--brand)}
h1 .en{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.sub{color:var(--mut);font-size:15px;margin-top:6px}
#status{font-size:13px;color:var(--mut);white-space:nowrap;align-self:flex-start}

/* ---- בחירת ספר ---- */
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
.book{position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:0 0 10px;cursor:pointer;font:inherit;color:var(--ink);text-align:start;overflow:hidden;transition:transform .12s,box-shadow .12s,border-color .12s}
.book:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px var(--shadow)}
.book img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--soft)}
.book .bn{font-weight:800;font-size:20px;color:var(--brand);margin:8px 12px 0;direction:ltr;text-align:start}
.book .bt{font-size:14px;color:var(--mut);margin:0 12px;direction:rtl;text-align:start}
.book .bd{font-size:13px;color:var(--mut);margin:2px 12px 0;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
.book.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.book .cnt{position:absolute;top:8px;inset-inline-start:8px;min-width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;display:none;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.book.has .cnt{display:flex}

/* ---- נגן ---- */
.stage{display:flex;justify-content:center}
video{width:min(100%,860px);aspect-ratio:4/3;background:#000;border-radius:var(--r);display:block;border:3px solid var(--brand);box-shadow:0 14px 30px -16px var(--shadow)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.speed{margin-top:16px}
.vrow{margin:0 0 10px}
.hint{color:var(--mut);font-size:14px}

/* ---- לשוניות ---- */
.tabs{display:flex;gap:10px;margin:26px 0 14px;flex-wrap:wrap}
.tab{background:var(--card);border:2px solid var(--line);color:var(--ink);padding:9px 20px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700}
.tab.on{background:var(--btn);border-color:var(--btn);color:#fff}

/* ---- הערה חדשה ---- */
.draft{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),#fff 70px)}
.draft.hasText{border-color:var(--btn)}
.tc{direction:ltr;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--brand);border:2px solid var(--accent);border-radius:999px;padding:3px 16px;font:inherit;font-weight:800;font-size:18px;cursor:pointer}
input.tc{width:110px;text-align:center;cursor:text;outline:none}
.speed .tc{cursor:default}
textarea{width:100%;min-height:92px;margin-top:10px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;resize:vertical}
textarea:focus,input.tc:focus,select.g:focus{outline:3px solid var(--ring);border-color:var(--brand)}
button.b{background:var(--btn);color:#fff;border:0;padding:10px 28px;border-radius:999px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 6px 14px -6px var(--shadow)}
button.b:active{transform:translateY(1px)}
button.g,select.g{background:#fff;color:var(--ink);border:2px solid var(--line);padding:5px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
button.g:hover{background:var(--soft);border-color:var(--brand)}
.scope{display:flex;gap:6px;flex-wrap:wrap}
.scope label{cursor:pointer}
.scope input{display:none}
.scope span{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px;font-weight:700;background:#fff}
.scope input:checked+span{background:var(--btn);border-color:var(--btn);color:#fff}
button.rec{border-color:var(--red);color:var(--red);font-weight:700}
button.rec.on{background:var(--red);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(196,35,26,.25)}}
.draft.drag{outline:3px dashed var(--brand);outline-offset:4px}

/* ---- רשימת הערות ---- */
.note .txt{white-space:pre-wrap;margin-top:8px}
.badge{border:2px solid var(--line);border-radius:999px;padding:1px 12px;font-size:13px;font-weight:700;background:#fff}
.badge.gen{background:var(--btn);border-color:var(--btn);color:#fff}
.badge.one{background:var(--accent-soft);border-color:var(--accent);color:var(--brand)}
.badge.done{background:var(--mut);border-color:var(--mut);color:#fff}
.note.done{opacity:.55}
.hidden{display:none}
.voice{margin-top:8px;padding:8px 12px;background:var(--soft);border-radius:12px;white-space:pre-wrap;font-size:16px}
audio{width:100%;margin-top:8px;height:38px}
.files{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.fchip{position:relative;display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:6px 12px;max-width:100%;font-size:14px;text-decoration:none;color:var(--ink)}
.fchip img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.fchip.img{padding:4px}
.fchip .x{position:absolute;top:-9px;inset-inline-start:-9px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--accent-soft);cursor:pointer;font-weight:800;line-height:1;padding:0}
.fchip.missing{opacity:.5}.fchip b{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;display:inline-block}

@media(max-width:560px){
  .hero{flex-direction:column;align-items:flex-start;gap:10px}.logo{height:70px;max-width:70%}
  .books{gap:8px}.book .bn{font-size:17px;margin:6px 8px 0}.book .bt,.book .bd{margin-inline:8px;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img class="logo" src="logo.png" alt="קראנץ׳ סטודיו">
    <div class="ttl">
      <h1>בית מדרש ויזניץ · אשדוד</h1>
      <div class="sub">סרטון סיור · סקירה והערות תיקון. עוצרים · כותבים · ממשיכים — הטיימקוד נקבע לבד. אפשר לצלם פריים, לצרף תמונות ולהקליט.</div>
    </div>
    <span id="status"></span>
  </header>

  <nav class="books" id="books" aria-label="בחירת סרטון"></nav>

  <div class="row vrow hidden" id="vrow"><b>🎬 גרסה:</b><select id="vsel" class="g"></select></div>
  <div class="stage"><video id="v" controls preload="metadata" playsinline></video></div>

  <div class="card speed row">
    <b>⚡ מהירות</b>
    <button class="g" id="spM" aria-label="האט">−</button>
    <input type="range" id="spR" min="0.5" max="2" step="0.1" value="1" style="flex:1;min-width:120px;accent-color:var(--brand)">
    <button class="g" id="spP" aria-label="הגבר">+</button>
    <span class="tc" id="spV">1.0x</span>
    <button class="g" id="spReset">איפוס</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="write">✍️ כתיבת הערות</button>
    <button class="tab" data-t="list">📋 כל ההערות (<span id="cnt">0</span>)</button>
  </div>

  <section id="write">
    <div class="card draft" id="draftCard">
      <div class="row">
        <span class="hint">טיימקוד:</span>
        <input class="tc" id="dtc" value="0:00" title="אפשר לערוך ידנית">
        <button class="g" id="sync">⏱ קח את הזמן הנוכחי</button>
        <button class="g" id="back">⟲ 3 שניות אחורה</button>
        <button class="g rec" id="rec">🎙 הקלט הערה קולית</button><span class="hint" id="recT"></span>
        <button class="g" id="snap">📸 צלם פריים</button>
        <button class="g" id="attach">📎 צרף קבצים / תמונות</button><input type="file" id="fin" multiple hidden>
      </div>
      <textarea id="dtxt" placeholder="עצרו את הסרטון — הטיימקוד נקבע אוטומטית. כתבו כאן מה לתקן…  (Ctrl/⌘+Enter לשליחה). אפשר להוסיף כמה הערות שרוצים."></textarea>
      <div id="dfiles" class="files"></div>
      <div class="hint" style="margin-top:6px">אפשר גם לגרור קבצים לכאן או להדביק תמונה (Ctrl/⌘+V)</div>
      <div class="row" style="margin-top:10px">
        <span class="hint">סוג:</span>
        <div class="scope">
          <label><input type="radio" name="scope" value="" checked><span>לא סימנתי — תחליט</span></label>
          <label><input type="radio" name="scope" value="one"><span>רק כאן</span></label>
          <label><input type="radio" name="scope" value="general"><span>הוראה כללית (בכל הסרטונים)</span></label>
        </div>
      </div>
      <div class="row" style="margin-top:12px"><button class="b" id="send">הוסף הערה ➕</button><span class="hint" id="dhint"></span></div>
    </div>
    <div id="recent"></div>
  </section>

  <section id="list" class="hidden">
    <div class="row" style="margin-bottom:10px">
      <button class="g" id="copy">📎 העתק הכול כטקסט</button>
      <label class="hint"><input type="checkbox" id="showDone" style="accent-color:var(--brand)"> הצג גם הערות שטופלו</label>
      <span class="hint">לחיצה על הטיימקוד קופצת לשם בסרטון</span>
    </div>
    <div id="all"></div>
  </section>
</div>

<script>
const SITE='vz-tour';
const v=document.getElementById('v');
const $=id=>document.getElementById(id);
const LS=(k,val)=>{try{if(val===undefined)return localStorage.getItem('pjr:'+SITE+':'+k);localStorage.setItem('pjr:'+SITE+':'+k,val)}catch(e){return null}};
let notes=[],books=[],curBook=null,curFile='';
const curVideo=()=>curFile;
const mine=()=>notes.filter(n=>(n.video||'')===curFile);

const fmt=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const parse=t=>{const p=t.trim().split(':').map(Number);if(p.some(isNaN))return null;return p.reduce((a,n)=>a*60+n,0)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- ספרים וגרסאות ---------- */
const bookOf=file=>books.find(b=>b.versions.some(x=>x.file===file));
function openCount(b){return notes.filter(n=>n.status!=='done'&&b.versions.some(x=>x.file===n.video)).length}
function renderBooks(){
  $('books').innerHTML=books.map(b=>{const c=openCount(b);
    return `<button class="book ${b.id===curBook?'on':''} ${c?'has':''}" data-book="${esc(b.id)}">
      <img src="${esc(b.poster)}" alt="">
      <span class="cnt" title="הערות פתוחות">${c}</span>
      <span class="bn">${esc(b.name||b.id)}</span><span class="bt">${esc(b.title)}</span><span class="bd">${esc(b.duration)}</span></button>`}).join('');
}
function selectBook(id,file){
  const b=books.find(x=>x.id===id)||books[0];curBook=b.id;
  curFile=file||b.versions[b.versions.length-1].file;
  v.pause();v.poster=b.poster;v.src=curFile;
  $('vrow').classList.toggle('hidden',b.versions.length<2);
  $('vsel').innerHTML=b.versions.map(x=>`<option value="${esc(x.file)}" ${x.file===curFile?'selected':''}>${esc(x.label)}</option>`).join('');
  dtc.value='0:00';tcLocked=false;$('draftCard').classList.remove('hasText');
  LS('book',curBook);renderBooks();render();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-book]');if(b)selectBook(b.dataset.book)});
$('vsel').onchange=()=>selectBook(curBook,$('vsel').value);

/* ---------- שמירה בענן (אותה שמירה משותפת של riddle, מפתחות ייעודיים לאתר הזה) ---------- */
const STORE='https://riddle-store-yh.netlify.app/api/store?id=';
const NOTES_KEY='4b0e8224-b20e-4da0-9e20-3c4eac960a1b';
const CHUNK=120*1024;
const uuid=()=>crypto.randomUUID();
async function sget(key){
  const r=await fetch(STORE+key,{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('get '+r.status);
  return r.json();
}
async function sput(key,data){
  const r=await fetch(STORE+key,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!r.ok)throw new Error('put '+r.status);
}
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
async function putBlob(blob,name){
  const text=b64(await blob.arrayBuffer());
  const chunks=[];
  for(let i=0;i<text.length;i+=CHUNK)chunks.push(text.slice(i,i+CHUNK));
  const keys=chunks.map(()=>uuid());
  await Promise.all(chunks.map((c,i)=>sput(keys[i],{d:c})));
  const key=uuid();
  await sput(key,{name,type:blob.type||'application/octet-stream',size:blob.size,chunks:keys});
  return {blob:key,name,type:blob.type||'application/octet-stream',size:blob.size};
}
const blobCache=new Map();
function getBlobUrl(key){
  if(!blobCache.has(key))blobCache.set(key,(async()=>{
    const m=await sget(key);if(!m)throw new Error('missing');
    const parts=await Promise.all(m.chunks.map(k=>sget(k)));
    const bin=atob(parts.map(p=>p.d).join(''));
    const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u8],{type:m.type}));
  })());
  return blobCache.get(key);
}
function hydrateBlobs(){
  document.querySelectorAll('[data-blob]:not([data-done])').forEach(el=>{
    el.dataset.done='1';
    getBlobUrl(el.dataset.blob).then(u=>{
      if(el.tagName==='A'){el.href=u;el.download=el.dataset.name||'file'}else el.src=u;
    }).catch(()=>{el.classList.add('missing')});
  });
}

/* שמירת הערות: כל שינוי = קריאה של הגרסה העדכנית, שינוי, וכתיבה (כדי שכמה אנשים יוכלו לכתוב במקביל) */
let busy=0;
function setStatus(t){$('status').textContent=t}
async function load(){
  try{
    notes=(await sget(NOTES_KEY))||[];
    LS('notes',JSON.stringify(notes));setStatus('');
  }catch(e){
    notes=JSON.parse(LS('notes')||'[]');setStatus('⚠ אין חיבור — מוצגות הערות מהמטמון');
  }
  render();
}
async function commit(mutator){
  busy++;setStatus('שומר…');
  try{
    const fresh=(await sget(NOTES_KEY))||[];
    notes=mutator(fresh);
    await sput(NOTES_KEY,notes);
    LS('notes',JSON.stringify(notes));
    setStatus('✔ נשמר');render();return true;
  }catch(e){
    setStatus('⚠ לא נשמר — בדקו חיבור ונסו שוב');return false;
  }finally{busy--}
}
setInterval(()=>{if(!busy&&!document.hidden&&!rec&&!dtxt.value.trim())load()},30000);

/* ---------- טיימקוד אוטומטי: עצירה = הזמן נקבע ---------- */
const dtxt=$('dtxt'),dtc=$('dtc');
let tcLocked=false; // אחרי שהתחלת לכתוב/ערכת ידנית — הזמן נשאר
function autoTc(){
  if(!tcLocked){dtc.value=fmt(v.currentTime);$('dhint').textContent=''}
  else $('dhint').textContent='הטיימקוד נשאר כפי שהיה; "קח את הזמן הנוכחי" לעדכון';
}
v.addEventListener('pause',autoTc);
v.addEventListener('seeked',()=>{if(v.paused)autoTc()});
dtxt.addEventListener('input',()=>{tcLocked=!!dtxt.value.trim();$('draftCard').classList.toggle('hasText',tcLocked)});
dtc.addEventListener('input',()=>tcLocked=true);
$('sync').onclick=()=>{dtc.value=fmt(v.currentTime);tcLocked=true;$('dhint').textContent=''};
$('back').onclick=()=>{const t=Math.max(0,(parse(dtc.value)??v.currentTime)-3);dtc.value=fmt(t);v.currentTime=t;tcLocked=true};
// כשמתחילים לכתוב בזמן שהסרטון רץ – עוצרים אותו (והזמן ננעל)
dtxt.addEventListener('focus',()=>{if(!v.paused){v.pause();dtc.value=fmt(v.currentTime);tcLocked=false}});

/* ---------- קבצים מצורפים (נשמרים בענן בחתיכות) ---------- */
let dfiles=[];
const MAXFILE=3*1024*1024;
const isImg=f=>/^image\//.test(f.type||'')||/\.(png|jpe?g|gif|webp|bmp|svg|heic)$/i.test(f.name||'');
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';
function fileHTML(f,rm){
  const x=rm?`<button class="x" data-rmf="${esc(f.blob)}" title="הסר">×</button>`:'';
  return isImg(f)
    ?`<a class="fchip img" data-blob="${esc(f.blob)}" data-name="${esc(f.name)}" target="_blank" title="${esc(f.name)}"><img data-blob="${esc(f.blob)}" alt="">${x}</a>`
    :`<a class="fchip" data-blob="${esc(f.blob)}" data-name="${esc(f.name)}" target="_blank">📄 <b>${esc(f.name)}</b><span class="hint">${fsize(f.size||0)}</span>${x}</a>`;
}
function renderDraftFiles(){$('dfiles').innerHTML=dfiles.map(f=>fileHTML(f,true)).join('');hydrateBlobs()}
// תמונות גדולות מוקטנות (עד 1400px, JPEG) כדי שההעלאה תהיה מהירה
async function shrinkImage(file){
  if(!/^image\/(png|jpeg|webp|bmp)/.test(file.type)||file.size<200*1024)return file;
  try{
    const bmp=await createImageBitmap(file);const k=Math.min(1,1400/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return b&&b.size<file.size?new File([b],(file.name||'image').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file;
  }catch(e){return file}
}
async function uploadFiles(list){
  for(let file of list){
    $('recT').textContent='מעלה '+(file.name||'תמונה')+'…';
    try{
      file=await shrinkImage(file);
      if(file.size>MAXFILE){$('recT').textContent='⚠ הקובץ גדול מדי (עד 3MB): '+file.name;return}
      dfiles.push(await putBlob(file,file.name||('paste-'+Date.now()+'.png')));
    }catch(e){$('recT').textContent='⚠ ההעלאה נכשלה: '+(file.name||'');return}
  }
  $('recT').textContent='';renderDraftFiles();
}
$('attach').onclick=()=>$('fin').click();
// צילום הפריים הנוכחי של הסרטון כתמונה מצורפת להערה
$('snap').onclick=async()=>{
  v.pause();if(!tcLocked){dtc.value=fmt(v.currentTime)}
  try{const c=document.createElement('canvas');const k=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight));
    c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
    uploadFiles([new File([b],'frame-'+fmt(v.currentTime).replace(/[:.]/g,'-')+'.jpg',{type:'image/jpeg'})]);
  }catch(e){$('recT').textContent='⚠ לא הצלחתי לצלם את הפריים'}
};
$('fin').onchange=e=>{uploadFiles([...e.target.files]);e.target.value=''};
const dc=$('draftCard');
['dragenter','dragover'].forEach(t=>dc.addEventListener(t,e=>{e.preventDefault();dc.classList.add('drag')}));
['dragleave','drop'].forEach(t=>dc.addEventListener(t,e=>{e.preventDefault();dc.classList.remove('drag')}));
dc.addEventListener('drop',e=>{if(e.dataTransfer.files.length)uploadFiles([...e.dataTransfer.files])});
document.addEventListener('paste',e=>{
  const fs=[...(e.clipboardData?e.clipboardData.files:[])];
  if(fs.length){e.preventDefault();uploadFiles(fs)}
});
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-rmf]');
  if(r){e.preventDefault();e.stopPropagation();dfiles=dfiles.filter(f=>f.blob!==r.dataset.rmf);renderDraftFiles()}
},true);

/* ---------- שליחה ---------- */
function resetDraft(){
  dfiles=[];renderDraftFiles();dtxt.value='';tcLocked=false;$('draftCard').classList.remove('hasText');$('dhint').textContent='';
  document.querySelector('input[name=scope][value=""]').checked=true;
  dtc.value=fmt(v.currentTime);
}
async function send(){
  const text=dtxt.value.trim();if(!text&&!dfiles.length)return;
  const t=parse(dtc.value);
  const scope=(document.querySelector('input[name=scope]:checked')||{}).value||'';
  const note={video:curVideo(),id:Date.now(),t:t==null?v.currentTime:t,scope,text,files:dfiles,status:'new',at:new Date().toISOString()};
  $('send').disabled=true;
  const ok=await commit(list=>[...list,note]);
  $('send').disabled=false;
  if(ok){resetDraft();dtxt.focus()}   // אם השמירה נכשלה — הטקסט נשאר, אפשר ללחוץ שוב
}
$('send').onclick=send;
dtxt.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});

/* ---------- הקלטה קולית (נשמרת בענן; התמלול מתווסף בעת הטיפול בהערות) ---------- */
let rec=null,recStream=null,recChunks=[],recT0=0,recTick=null,recSince=0;
async function toggleRec(){
  if(rec){rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){$('recT').textContent='⚠ הדפדפן הזה לא תומך בהקלטה — כתבו הערה';return}
  if(!v.paused)v.pause();
  if(!tcLocked){dtc.value=fmt(v.currentTime)}
  tcLocked=true;recT0=parse(dtc.value)??v.currentTime;
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){$('recT').textContent='⚠ אין גישה למיקרופון — אשרו בדפדפן';return}
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/mp4';
  rec=new MediaRecorder(recStream,{mimeType:mime});recChunks=[];
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=()=>finishRec(mime);
  rec.start();recSince=Date.now();
  $('rec').classList.add('on');$('rec').textContent='⏹ סיים הקלטה';
  recTick=setInterval(()=>{$('recT').textContent='● מקליט '+fmt((Date.now()-recSince)/1000)},250);
}
async function finishRec(mime){
  clearInterval(recTick);recStream.getTracks().forEach(t=>t.stop());
  $('rec').classList.remove('on');$('rec').textContent='🎙 הקלט הערה קולית';
  const blob=new Blob(recChunks,{type:mime});rec=null;
  if(blob.size<2000){$('recT').textContent='ההקלטה קצרה מדי — לא נשמרה';return}
  if(blob.size>MAXFILE){$('recT').textContent='⚠ ההקלטה ארוכה מדי — קצרו או פצלו להערות';return}
  $('recT').textContent='שומר את ההקלטה…';
  let a;
  try{a=await putBlob(blob,'voice.'+(mime.includes('mp4')?'m4a':'webm'))}
  catch(e){$('recT').textContent='⚠ ההקלטה לא נשמרה — נסו שוב';return}
  const scope=(document.querySelector('input[name=scope]:checked')||{}).value||'';
  const id=Date.now();
  const note={video:curVideo(),id,t:recT0,scope,text:dtxt.value.trim(),audio:a,files:dfiles,voice:'',status:'new',at:new Date().toISOString()};
  const ok=await commit(list=>[...list,note]);
  if(ok){resetDraft();$('recT').textContent='✔ ההקלטה נשמרה'}
  else $('recT').textContent='⚠ ההקלטה הועלתה אך ההערה לא נשמרה — נסו שוב';
}
$('rec').onclick=toggleRec;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rec){rec.stop()}});

/* ---------- תצוגה ---------- */
const scopeBadge=n=>n.scope==='general'?'<span class="badge gen">הוראה כללית</span>':n.scope==='one'?'<span class="badge one">רק כאן</span>':'';
function noteHTML(n,edit){
  const done=n.status==='done';
  return `<div class="card note ${done?'done':''}" data-id="${n.id}">
    <div class="row">
      <button class="tc" data-seek="${n.t}">${fmt(n.t)}</button>
      ${scopeBadge(n)}${done?'<span class="badge done">טופל</span>':''}
      <span style="flex:1"></span>
      ${edit?`<button class="g" data-edit="${n.id}">עריכה</button><button class="g" data-del="${n.id}">מחיקה</button>`:''}
    </div>
    ${n.text?`<div class="txt">${esc(n.text||'')}</div>`:''}
    ${(n.files&&n.files.length)?`<div class="files">${n.files.map(f=>fileHTML(f,false)).join('')}</div>`:''}
    ${n.audio?`<audio controls preload="none" data-blob="${esc(n.audio.blob)}"></audio><div class="voice">${n.voice?'🎙 '+esc(n.voice):'🎙 הקלטה קולית (התמלול יתווסף בעת הטיפול בהערות)'}</div>`:''}</div>`;
}
function render(){
  const open=mine().filter(n=>n.status!=='done');
  $('cnt').textContent=open.length;
  $('recent').innerHTML=[...open].slice(-3).reverse().map(n=>noteHTML(n,false)).join('');
  const list=$('showDone').checked?mine():open;
  const sorted=[...list].sort((a,b)=>a.t-b.t||a.id-b.id);
  $('all').innerHTML=sorted.length?sorted.map(n=>noteHTML(n,true)).join(''):'<div class="hint">עדיין אין הערות.</div>';
  renderBooks();hydrateBlobs();
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-seek]');
  if(s){v.currentTime=+s.dataset.seek;v.scrollIntoView({behavior:'smooth',block:'center'});return}
  const d=e.target.closest('[data-del]');
  if(d&&confirm('למחוק את ההערה?')){commit(list=>list.filter(n=>n.id!=d.dataset.del));return}
  const ed=e.target.closest('[data-edit]');
  if(ed){const n=notes.find(n=>n.id==ed.dataset.edit);
    const x=prompt('עריכת הערה:',n.text||'');if(x!==null&&(x.trim()||n.audio||(n.files&&n.files.length))){
      const t=prompt('טיימקוד (mm:ss):',fmt(n.t));const p=t&&parse(t);
      const sc=prompt('סוג: ריק = תחליט, one = רק כאן, general = כללי',n.scope||'');
      commit(list=>list.map(m=>m.id!=n.id?m:{...m,text:x.trim(),t:p!=null?p:m.t,scope:sc!==null?(['one','general'].includes(sc.trim())?sc.trim():''):m.scope}))}}
});
$('showDone').onchange=render;
$('copy').onclick=async()=>{
  const sorted=[...mine().filter(n=>n.status!=='done')].sort((a,b)=>a.t-b.t||a.id-b.id);
  await navigator.clipboard.writeText(sorted.map(n=>`[${fmt(n.t)}]${n.scope==='general'?' (כללי)':n.scope==='one'?' (רק כאן)':''} ${[n.text,n.voice&&('🎙 '+n.voice),(n.files||[]).length&&('📎 '+n.files.map(f=>f.name).join(', '))].filter(Boolean).join('\n')}`).join('\n\n'));
  $('copy').textContent='✔ הועתק';setTimeout(()=>$('copy').textContent='📎 העתק הכול כטקסט',1500);
};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $('write').classList.toggle('hidden',b.dataset.t!=='write');
  $('list').classList.toggle('hidden',b.dataset.t!=='list');
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/TEXTAREA|INPUT|BUTTON|SELECT/.test(document.activeElement.tagName)){e.preventDefault();v.paused?v.play():v.pause()}
});

/* ---------- מהירות ---------- */
function setSpeed(x){
  x=Math.min(2,Math.max(0.5,Math.round(x*10)/10));
  v.playbackRate=x;v.preservesPitch=true;
  $('spR').value=x;$('spV').textContent=x.toFixed(1)+'x';
  LS('speed',x);
}
$('spR').oninput=e=>setSpeed(+e.target.value);
$('spM').onclick=()=>setSpeed(v.playbackRate-0.1);
$('spP').onclick=()=>setSpeed(v.playbackRate+0.1);
$('spReset').onclick=()=>setSpeed(1);
v.addEventListener('loadedmetadata',()=>setSpeed(+(LS('speed')||1)));
setSpeed(+(LS('speed')||1));

window.addEventListener('focus',()=>{if(!busy&&!dtxt.value.trim())load()});

/* ---------- אתחול ---------- */
(async()=>{
  books=(await (await fetch('videos.json')).json()).books;
  await load();
  selectBook(LS('book')||books[0].id);
})();
</script>
