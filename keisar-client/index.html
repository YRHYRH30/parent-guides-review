<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1208">
  <title>מעשה בקיסר ומלך</title>
  <meta name="description" content="מעשה בקיסר ומלך — מעשייה לרבי נחמן מברסלב, 22:47">
  <style>
    @font-face{font-family:Heebo;font-weight:100 900;font-display:swap;font-style:normal;
      src:url(fonts/Heebo-Hebrew.woff2) format("woff2");
      unicode-range:U+0590-05FF,U+200C-201D,U+20AA,U+FB1D-FB4F}
    @font-face{font-family:Heebo;font-weight:100 900;font-display:swap;font-style:normal;
      src:url(fonts/Heebo-Latin.woff2) format("woff2");
      unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    :root{
      --bg:#f4ead8;
      --bg2:#fbf6ec;
      --ink:#2a1c0e;
      --muted:#6a5338;
      --gold:#b8892a;
      --gold-soft:#e8d5a3;
      --line:#e2d2b4;
      --card:#fffdf8;
      --active:#5a3a12;
      --radius:18px;
      --shadow:0 18px 50px rgba(42,28,14,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
      font-family:Heebo,system-ui,Arial,sans-serif;line-height:1.55;
      -webkit-text-size-adjust:100%}
    body{
      min-height:100vh;
      background:
        radial-gradient(1200px 500px at 50% -80px, #f8f1e3 0%, transparent 70%),
        var(--bg);
      padding:24px 16px 48px;
      padding-top:max(24px, env(safe-area-inset-top));
      padding-bottom:max(48px, env(safe-area-inset-bottom));
    }
    .wrap{width:min(860px,100%);margin:0 auto}
    header{text-align:center;margin:8px 0 22px}
    .ornament{
      width:72px;height:1px;margin:0 auto 16px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
      position:relative
    }
    .ornament::after{
      content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);
      width:7px;height:7px;background:var(--gold);border-radius:1px
    }
    h1{
      margin:0;font-size:clamp(1.7rem,5.5vw,2.35rem);font-weight:800;letter-spacing:-.02em;
      line-height:1.25
    }
    .sub{
      margin:8px 0 0;color:var(--muted);font-size:0.98rem;font-weight:500
    }
    .dur{display:inline-block;margin-top:6px;color:var(--gold);font-weight:700;font-size:.92rem;letter-spacing:.04em}
    .player{
      background:#0d0a06;border-radius:var(--radius);overflow:hidden;
      box-shadow:var(--shadow);border:1px solid #2a1c0e
    }
    video{display:block;width:100%;height:auto;vertical-align:middle;background:#0d0a06;
      aspect-ratio:16/9}
    .chapters{margin-top:28px}
    .chapters h2{
      margin:0 0 12px;font-size:1.05rem;font-weight:800;color:var(--active);
      display:flex;align-items:center;gap:10px
    }
    .chapters h2::after{
      content:"";flex:1;height:1px;background:var(--line)
    }
    ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
    button.ch{
      appearance:none;-webkit-appearance:none;width:100%;
      display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;
      text-align:right;cursor:pointer;
      background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:14px 16px;color:var(--ink);font:inherit;
      transition:background .15s,border-color .15s,transform .12s;
      min-height:56px
    }
    button.ch:hover{border-color:var(--gold);background:#fff}
    button.ch:active{transform:scale(.99)}
    button.ch:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
    button.ch.is-active{
      background:#5a3a12;border-color:#5a3a12;color:#fbf6ec;
      box-shadow:0 8px 24px rgba(90,58,18,.28)
    }
    button.ch.is-active .tc{color:#e8d5a3}
    button.ch.is-active .hint{color:#e8d5a3}
    .tc{
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
      font-weight:800;color:var(--gold);letter-spacing:.03em;font-size:1rem
    }
    .lab{font-weight:800;font-size:1.05rem}
    .hint{display:block;font-weight:500;color:var(--muted);font-size:.86rem;margin-top:1px}
    .chev{color:var(--muted);font-size:1.2rem;opacity:.7}
    button.ch.is-active .chev{color:#e8d5a3}
    footer{margin-top:32px;text-align:center;color:var(--muted);font-size:.82rem}
    @media (max-width:520px){
      body{padding:16px 12px 40px}
      button.ch{grid-template-columns:64px 1fr auto;padding:13px 12px;gap:8px}
      .tc{font-size:.95rem}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="ornament" aria-hidden="true"></div>
      <h1>מעשה בקיסר ומלך</h1>
      <p class="sub">מעשייה לרבי נחמן מברסלב</p>
      <div class="dur">22:47</div>
    </header>

    <div class="player">
      <video id="film" playsinline webkit-playsinline controls preload="metadata" poster="poster.jpg" title="מעשה בקיסר ומלך">
        <source src="maase.mp4" type="video/mp4">
      </video>
    </div>

    <nav class="chapters" aria-label="פרקי הסיפור">
      <h2>פרקים</h2>
      <ol id="list"></ol>
    </nav>
  </div>

  <script>
    const chapters = [
      { t: 0,    tc: "00:00", label: "חלק א׳", title: "המפגש והאהבה" },
      { t: 300,  tc: "05:00", label: "חלק ב׳", title: "הבריחה והים" },
      { t: 600,  tc: "10:00", label: "חלק ג׳", title: "הגזלנים והתחפושת" },
      { t: 900,  tc: "15:00", label: "חלק ד׳", title: "הרופא והכתר" },
      { t: 1200, tc: "20:00", label: "חלק ה׳", title: "החתונה וההתרה" }
    ];

    const film = document.getElementById("film");
    const list = document.getElementById("list");
    const buttons = [];

    chapters.forEach((ch, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ch";
      b.dataset.i = i;
      b.setAttribute("aria-label", `${ch.label}, ${ch.title}, ${ch.tc}`);
      b.innerHTML = `<span class="tc">${ch.tc}</span><span><span class="lab">${ch.label}</span><span class="hint">${ch.title}</span></span><span class="chev" aria-hidden="true">‹</span>`;
      b.addEventListener("click", () => jump(i, true));
      li.appendChild(b);
      list.appendChild(li);
      buttons.push(b);
    });

    function currentIndex(t) {
      let i = 0;
      for (let k = 0; k < chapters.length; k++) if (t >= chapters[k].t - 0.05) i = k;
      return i;
    }

    function mark(i) {
      buttons.forEach((b, k) => {
        const on = k === i;
        b.classList.toggle("is-active", on);
        b.setAttribute("aria-current", on ? "true" : "false");
      });
    }

    function jump(i, play) {
      const ch = chapters[i];
      film.currentTime = ch.t;
      mark(i);
      history.replaceState(null, "", "#t=" + ch.tc);
      if (play) {
        const p = film.play();
        if (p && p.catch) p.catch(() => {});
      }
    }

    film.addEventListener("timeupdate", () => mark(currentIndex(film.currentTime)));
    film.addEventListener("seeked", () => mark(currentIndex(film.currentTime)));

    function parseHash() {
      const h = (location.hash || "").replace(/^#/, "");
      if (!h) return;
      let sec = null;
      const m1 = h.match(/^(?:t=)?(\d+):(\d{2})$/);
      const m2 = h.match(/^(?:t=)?(\d+(?:\.\d+)?)$/);
      if (m1) sec = (+m1[1]) * 60 + (+m1[2]);
      else if (m2) sec = +m2[1];
      if (sec == null || !isFinite(sec)) return;
      const i = currentIndex(sec);
      // If the hash is exactly a chapter start, land there; otherwise seek to the requested time.
      film.currentTime = sec;
      mark(i);
    }
    window.addEventListener("hashchange", parseHash);
    film.addEventListener("loadedmetadata", parseHash);
    if (location.hash) {
      // Some browsers need a nudge before metadata
      parseHash();
    }
    mark(0);
  </script>
</body>
</html>
